name: Bump Harvard CSL

# Upstream citation-style-language/styles does not tag releases, so the
# sha256 in flake.nix:harvardCsl drifts whenever they edit the file.
# This job runs weekly: it fetches the current CSL, computes the SRI
# hash, and opens a PR if it differs from what's pinned in flake.nix.

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read   # gate-activity reads the prior run via `gh run list`

jobs:
  # Skip the heavy bump job when the cron fires against a dormant
  # repo (no commits since the last successful run). workflow_dispatch
  # bypasses the gate so a maintainer can always force a check.
  #
  # The check is cheap — one `gh run list` call against the Actions
  # API — and runs whether the trigger is schedule or workflow_dispatch
  # so the manual path also gets the diagnostic output.
  gate-activity:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check for commits since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::workflow_dispatch — bypassing dormancy gate."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=$(gh run list \
            --workflow=bump-csl.yml \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha // ""' \
            --repo "$GITHUB_REPOSITORY")

          if [ -z "$last_sha" ]; then
            echo "::notice::No prior successful run — proceeding (first-time setup)."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_SHA" = "$last_sha" ]; then
            echo "::notice::HEAD ($GITHUB_SHA) unchanged since last successful run — skipping."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Commits since $last_sha → $GITHUB_SHA — proceeding."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: gate-activity
    if: needs.gate-activity.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Compute current upstream SRI hash
        id: compute
        run: |
          url=https://raw.githubusercontent.com/citation-style-language/styles/master/harvard-cite-them-right.csl
          new_sri=$(nix hash convert --hash-algo sha256 --to sri \
            "$(nix-prefetch-url "$url")")
          echo "new_sri=$new_sri" >> "$GITHUB_OUTPUT"

          current=$(grep -oP 'sha256-[A-Za-z0-9+/=]+' flake.nix | head -1)
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "$new_sri" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update flake.nix
        if: steps.compute.outputs.changed == 'true'
        run: |
          sed -i "s|${{ steps.compute.outputs.current }}|${{ steps.compute.outputs.new_sri }}|" flake.nix

      - name: Smoke-build to confirm the new hash works
        if: steps.compute.outputs.changed == 'true'
        run: nix build --print-build-logs

      - name: Open PR
        if: steps.compute.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/bump-csl
          title: "chore: bump Harvard CSL upstream hash"
          commit-message: "chore: bump Harvard CSL upstream hash"
          body: |
            Upstream `harvard-cite-them-right.csl` content has changed.

            - Old: `${{ steps.compute.outputs.current }}`
            - New: `${{ steps.compute.outputs.new_sri }}`

            Smoke-build on Linux already passed in this workflow. Verify
            the patched CTR13 sed rules still apply cleanly before merging.
